[project]
name = "market-briefing"
version = "0.1.0"
description = "KREAM 시세 스냅샷으로 만드는 근거 기반 질의응답(RAG)과 브리핑 음성·영상"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["numpy>=2.0", "openpyxl>=3.1", "matplotlib>=3.9", "requests>=2.32"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
market-briefing = "market_briefing.cli:main"

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["market_briefing"]

[tool.pytest.ini_options]
testpaths = ["tests"]
